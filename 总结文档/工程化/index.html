<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>requestIdleCallback 长列表渲染</title>
    <style>
        body {
            max-width: 720px;
            margin: 32px auto;
            padding: 0 16px;
            font-family: sans-serif;
        }

        #list {
            padding: 0;
            list-style: none;
        }

        #list li {
            padding: 8px 12px;
            border-bottom: 1px solid #ddd;
        }

        #status {
            position: sticky;
            top: 0;
            padding: 12px 0;
            background: white;
        }
    </style>
</head>
<body>
    <h1>requestIdleCallback 长列表渲染</h1>
    <p>在浏览器空闲时间分批创建并插入列表项，避免一次性渲染阻塞主线程。</p>
    <button id="render" type="button">重新渲染 10,000 项</button>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="list"></ul>

    <script>
        const totalItems = 10000;
        const batchLimit = 100;
        const list = document.querySelector('#list');
        const status = document.querySelector('#status');
        const renderButton = document.querySelector('#render');
        let nextIndex = 0;
        let scheduledTask;
        let usingIdleCallback = false;

        function cancelScheduledTask() {
            if (scheduledTask === undefined) return;

            if (usingIdleCallback) {
                cancelIdleCallback(scheduledTask);
            } else {
                clearTimeout(scheduledTask);
            }
            scheduledTask = undefined;
        }

        function scheduleNextBatch(callback) {
            if ('requestIdleCallback' in window) {
                usingIdleCallback = true;
                scheduledTask = requestIdleCallback(callback, { timeout: 100 });
            } else {
                usingIdleCallback = false;
                scheduledTask = setTimeout(() => {
                    callback({ timeRemaining: () => 8, didTimeout: true });
                }, 0);
            }
        }

        function renderBatch(deadline) {
            scheduledTask = undefined;
            const fragment = document.createDocumentFragment();
            let renderedInBatch = 0;

            while (
                nextIndex < totalItems &&
                renderedInBatch < batchLimit &&
                (deadline.timeRemaining() > 1 || deadline.didTimeout)
            ) {
                const item = document.createElement('li');
                item.textContent = `列表项 ${nextIndex + 1}`;
                fragment.appendChild(item);
                nextIndex += 1;
                renderedInBatch += 1;
            }

            list.appendChild(fragment);
            status.textContent = `已渲染 ${nextIndex} / ${totalItems} 项`;

            if (nextIndex < totalItems) {
                scheduleNextBatch(renderBatch);
            } else {
                status.textContent += '，渲染完成';
            }
        }

        function renderList() {
            cancelScheduledTask();
            list.replaceChildren();
            nextIndex = 0;
            status.textContent = `已渲染 0 / ${totalItems} 项`;
            scheduleNextBatch(renderBatch);
        }

        renderButton.addEventListener('click', renderList);
        renderList();
    </script>
</body>
</html>
